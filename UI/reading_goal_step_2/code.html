            background-color: theme('colors.secondary-container');
            color: theme('colors.on-secondary-container');
            border-color: transparent;
        }

<body class="antialiased min-h-screen flex flex-col items-center justify-center py-10 px-4 md:px-0">
<div class="w-full max-w-md bg-surface-container-low rounded-[2rem] p-6 shadow-xl flex flex-col gap-6 md:p-8">

<div class="flex justify-between items-center w-full mb-2">

</div>
<div class="w-full h-1 bg-surface-variant rounded-full overflow-hidden">

<p class="font-body-md text-body-md text-on-surface-variant mt-1">Select at least 3 genres to help us curate your library.</p>

<span class="material-symbols-outlined check-icon text-[18px] opacity-0 w-0 transition-all overflow-hidden" style="font-variation-settings: 'FILL' 1;">check</span>

</div>
