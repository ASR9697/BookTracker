<!-- Micro-interactions Script -->
<script>
        const slider = document.getElementById('progress-slider');
        const percentDisplay = document.getElementById('percent-display');
        const pageInput = document.getElementById('current-page');
        const totalPages = 662;

        slider.addEventListener('input', (e) => {
            const value = e.target.value;
            percentDisplay.textContent = `${value}%`;
            
            // Sync page number roughly
            const calculatedPage = Math.round((value / 100) * totalPages);
            pageInput.value = calculatedPage;
        });

        pageInput.addEventListener('input', (e) => {
            let value = parseInt(e.target.value) || 0;
            if (value > totalPages) value = totalPages;
            
            // Sync slider
            const calculatedPercent = Math.round((value / totalPages) * 100);
            slider.value = calculatedPercent;
            percentDisplay.textContent = `${calculatedPercent}%`;
        });

        // Simple button active states handled by Tailwind active:scale, but we can add haptic-like feel
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });
    </script>
