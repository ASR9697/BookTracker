<script>
        // Simple JS for visual interaction of the time picker columns
        // In a real app, this would dynamically generate 0-23/0-59 and handle exact scroll snapping logic
        
        function setupScrollInteractions(containerId) {
            const container = document.getElementById(containerId);
            if(!container) return;
            
            container.addEventListener('scroll', () => {
                const items = container.querySelectorAll('.time-item');
                const containerCenter = container.scrollTop + (container.clientHeight / 2);
                
                let closestItem = null;
                let minDistance = Infinity;

                items.forEach(item => {
                    // Reset styles
                    item.classList.remove('text-primary', 'font-bold', 'scale-110');
                    item.classList.add('text-on-surface-variant');
                    
                    const itemCenter = item.offsetTop + (item.clientHeight / 2);
                    const distance = Math.abs(containerCenter - itemCenter);
                    
                    if(distance < minDistance) {
                        minDistance = distance;
                        closestItem = item;
                    }
                });

                if(closestItem) {
                    closestItem.classList.remove('text-on-surface-variant');
                    closestItem.classList.add('text-primary', 'font-bold', 'scale-110');
                }
            });
            
            // Trigger once on load to set initial state
            container.dispatchEvent(new Event('scroll'));
        }

        // Delay setup slightly to ensure DOM is fully rendered for offset calculations
        setTimeout(() => {
            setupScrollInteractions('hour-picker');
            setupScrollInteractions('minute-picker');
            
            // Set initial scroll position to center items
            document.getElementById('hour-picker').scrollTop = 64;
            document.getElementById('minute-picker').scrollTop = 64;
        }, 100);
    </script>
