<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-tablet">
<!-- Celebration Screen Container -->
<main class="w-full max-w-md flex flex-col gap-stack-lg items-center text-center">
<!-- Header Section -->
<header class="flex flex-col items-center gap-stack-sm animate-[fadeIn_0.5s_ease-out]">
<div class="w-24 h-24 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Chapter Closed</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Fantastic session! You're making great progress.</p>
</header>
<!-- Stats Section (Bento Grid Style) -->
<section class="grid grid-cols-2 gap-4 w-full">
<!-- Duration -->
<div class="col-span-2 bg-surface-container rounded-lg p-6 flex flex-col items-center justify-center shadow-lg relative overflow-hidden group">
<div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-5 transition-opacity"></div>
<span class="material-symbols-outlined text-primary mb-2" style="font-variation-settings: 'FILL' 1;">timer</span>
<h2 class="font-display-lg text-display-lg text-on-surface">45</h2>
<span class="font-title-md text-title-md text-on-surface-variant">Minutes Read</span>
</div>
<!-- Pages Read -->
<div class="bg-surface-container rounded-lg p-4 flex flex-col items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-secondary mb-1" style="font-variation-settings: 'FILL' 1;">menu_book</span>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">32</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant">Pages</span>
</div>
<!-- Streak -->
<div class="bg-surface-container rounded-lg p-4 flex flex-col items-center justify-center shadow-lg border border-primary/20">
<span class="material-symbols-outlined text-primary mb-1" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">12</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant">Day Streak</span>
</div>
</section>
<!-- Book Context Card -->

<img class="w-16 h-24 object-cover rounded-md shadow-md" data-alt="A dark and moody fantasy book cover featuring a solitary figure playing a lute under a glowing, crescent moon, surrounded by ethereal mist and deep shadows. The color palette is dominated by dark blues, purples, and silver highlights. High quality, detailed illustration." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCdQw4QFkdnyimBkinToE1msEcvPYdx44S6JXLAzBLL_zQg9d1NPFb9goBMfeIeK5gkDOoP4EVXiHr6XaFJhgdGQctRSDRvQhbHBoKHqvNsOmKjAsIiudkKbKzTySGrzYn1yvePwc2MsH9IWiqHAjjTa8JhVXSSp_TBUzuETv0gZiG8FN4129XtvJ0l_BRTnPQJEA9soVY-L3duQvcQ-6dh1nbAqm3COB3bx6wzSTYD76FazAmP243M8tavA4v_hZzzTuS81k40WdY"/>

<p class="font-body-md text-body-md text-on-surface-variant mb-2">Patrick Rothfuss</p>
<!-- Progress Bar -->
<div class="w-full bg-surface-container-highest rounded-full h-2 overflow-hidden">
<div class="bg-primary h-full rounded-full" style="width: 42%;"></div>
</div>
<div class="flex justify-between mt-1">
<span class="font-label-sm text-label-sm text-on-surface-variant">42%</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">278 / 662 pages</span>
</div>
</div>
</section>

<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-full hover:bg-primary-fixed-dim active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check</span>

            </button>
